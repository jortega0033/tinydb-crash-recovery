name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The technical spec targets CPython 3.12.
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Review gate self-test
        run: python .claude/hooks/role_gate.py --self-test
      - name: Install dev requirements
        # Guard: requirements-dev.txt (pinned runner for the upstream suite) does not
        # exist until ticket #2 (walking skeleton) adds it. Ticket #2 removes this `if`.
        if: ${{ hashFiles('requirements-dev.txt') != '' }}
        run: python -m pip install -r requirements-dev.txt
      - name: Unit tests
        # Guard: the repository has no tests until ticket #2 (walking skeleton) adds the
        # first ones. Ticket #2 removes this `if` so the step runs unconditionally and
        # fails when no test is found. Linux-only tests skip on Windows (decision D7).
        if: ${{ hashFiles('tests/**/*.py') != '' }}
        run: python -m unittest discover -s tests -t .
      - name: Upstream TinyDB suite
        # Guard: third_party/tinydb/ is staged by ticket #2, which removes this `if`.
        if: ${{ hashFiles('third_party/tinydb/tests/**/*.py') != '' }}
        run: python -m pytest third_party/tinydb/tests

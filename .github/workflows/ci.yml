name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The technical spec targets CPython 3.12; 3.13 is what local agent runs use.
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # The two `if:` guards below remain only until ticket #10 stages requirements-dev.txt
      # and third_party/tinydb/. They are removed afterwards, as a direct tooling change by the
      # orchestrator or the owner, never inside a ticket (tickets do not edit CI).
      - name: Install dev requirements
        # requirements-dev.txt (pinned runner for the upstream suite) is added by ticket #10.
        if: ${{ hashFiles('requirements-dev.txt') != '' }}
        run: python -m pip install -r requirements-dev.txt
      - name: Unit tests
        # Linux-only tests skip on Windows (decision D7).
        run: python -m unittest discover -s tests -t . -v
      - name: Upstream TinyDB suite
        # third_party/tinydb/ is staged by ticket #10.
        if: ${{ hashFiles('third_party/tinydb/tests/**/*.py') != '' }}
        run: python -m pytest third_party/tinydb/tests
      - name: Review gate self-test
        run: python .claude/hooks/role_gate.py --self-test
